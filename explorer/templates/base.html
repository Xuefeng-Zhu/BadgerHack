<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Badger Sett Explorer{% endblock %}</title>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4ed;
            --text-dim: #8b8fa3;
            --accent: #6c8cff;
            --accent-hover: #8ba4ff;
            --green: #4ade80;
            --red: #f87171;
            --orange: #fb923c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.6;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); text-decoration: underline; }

        /* nav */
        nav {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0 2rem; display: flex; align-items: center; gap: 2rem;
            height: 56px; position: sticky; top: 0; z-index: 100;
        }
        nav .logo { font-weight: 700; font-size: 1.1rem; color: var(--text); }
        nav .logo span { color: var(--accent); }
        nav a.nav-link {
            color: var(--text-dim); font-size: 0.9rem; padding: 0.4rem 0;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        nav a.nav-link:hover, nav a.nav-link.active {
            color: var(--text); border-bottom-color: var(--accent);
            text-decoration: none;
        }

        .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem 2rem; }

        /* cards */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem; margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 1.2rem;
        }
        .stat-card .label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: 0.3rem; }

        .chart-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 1rem; margin-bottom: 1.5rem;
        }
        .chart-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; padding: 1rem; overflow: hidden;
        }
        .chart-card.full { grid-column: 1 / -1; }

        /* tables */
        .data-table {
            width: 100%; border-collapse: collapse;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden;
        }
        .data-table th {
            text-align: left; padding: 0.75rem 1rem;
            background: rgba(108,140,255,0.08); color: var(--text-dim);
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        .data-table td {
            padding: 0.6rem 1rem; border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: rgba(108,140,255,0.04); }

        /* search */
        .search-bar {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
        }
        .search-bar input {
            flex: 1; padding: 0.6rem 1rem; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); font-size: 0.95rem; outline: none;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar button, .btn {
            padding: 0.6rem 1.2rem; background: var(--accent);
            border: none; border-radius: 8px; color: #fff;
            font-size: 0.9rem; cursor: pointer; font-weight: 500;
        }
        .search-bar button:hover, .btn:hover { background: var(--accent-hover); }

        .pagination {
            display: flex; gap: 0.5rem; align-items: center;
            justify-content: center; margin-top: 1.5rem;
            color: var(--text-dim); font-size: 0.9rem;
        }
        .pagination a {
            padding: 0.4rem 0.8rem; background: var(--surface);
            border: 1px solid var(--border); border-radius: 6px;
        }

        .badge {
            display: inline-block; padding: 0.15rem 0.5rem;
            border-radius: 4px; font-size: 0.75rem; font-weight: 500;
        }
        .badge-success { background: rgba(74,222,128,0.15); color: var(--green); }
        .badge-error { background: rgba(248,113,113,0.15); color: var(--red); }
        .badge-timeout { background: rgba(251,146,60,0.15); color: var(--orange); }
        .badge-antibot { background: rgba(108,140,255,0.15); color: var(--accent); }

        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.2rem; margin-bottom: 0.8rem; color: var(--text-dim); }

        /* query page */
        textarea.sql-input {
            width: 100%; min-height: 120px; padding: 1rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.85rem; resize: vertical; outline: none;
        }
        textarea.sql-input:focus { border-color: var(--accent); }
        .schema-ref {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 1rem; margin-bottom: 1rem;
            font-size: 0.8rem; color: var(--text-dim);
        }
        .schema-ref summary { cursor: pointer; color: var(--text); font-weight: 500; }
        .schema-ref pre {
            margin-top: 0.5rem; white-space: pre-wrap;
            font-family: 'SF Mono', Monaco, monospace; font-size: 0.78rem;
        }
        .error-msg {
            background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
            border-radius: 8px; padding: 0.8rem 1rem; color: var(--red);
            margin: 1rem 0; font-size: 0.9rem;
        }
        .result-info { color: var(--text-dim); font-size: 0.85rem; margin: 0.8rem 0; }

        @media (max-width: 768px) {
            .chart-grid { grid-template-columns: 1fr; }
            nav { padding: 0 1rem; gap: 1rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">🦡 <span>Badger Sett</span> Explorer</div>
        <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a>
        <a href="/trackers" class="nav-link {% if request.endpoint in ('trackers','tracker_detail') %}active{% endif %}">Trackers</a>
        <a href="/sites" class="nav-link {% if request.endpoint in ('sites','site_detail') %}active{% endif %}">Sites</a>
        <a href="/query" class="nav-link {% if request.endpoint == 'query' %}active{% endif %}">SQL Query</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
